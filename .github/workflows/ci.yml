name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # mvnw verifies the Maven download against distributionSha256Sum; Testcontainers uses the runner's Docker.
      - name: Format, lint, tests and coverage gate
        run: ./mvnw -B verify
      - name: Mutation testing gate (PIT, 90%)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            java/target/surefire-reports/
            java/target/failsafe-reports/
            java/target/site/jacoco/
            java/target/pit-reports/
          if-no-files-found: ignore
